---
name: checker

"on":
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The toolchain rust-toolchain.toml pins, with its targets
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Tools the checker refuses to run without
        run: |
          cargo install --locked taplo-cli cargo-deny ast-grep
          npm i -g markdownlint-cli2
          pip install --break-system-packages yamllint
          leaks=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL "$leaks/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: The same gate that runs before a commit
        run: ./checker.sh --docker
