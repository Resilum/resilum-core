---
name: checker

"on":
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: checker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The toolchain rust-toolchain.toml pins, with its targets
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: >-
            ${{ github.ref == 'refs/heads/main'
                || github.ref == 'refs/heads/stage' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,cargo-deny,cargo-nextest
      - uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: gitleaks/gitleaks
      - uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: hadolint/hadolint
          tag: v2.14.0
          extension-matching: disable
          rename-to: hadolint
          chmod: 0755
      - name: The rest the checker refuses to run without
        env:
          SHELLCHECK: v0.11.0
        run: |
          sudo apt-get install -qq -y musl-tools
          npm i -g markdownlint-cli2 @ast-grep/cli
          pip install --break-system-packages yamllint
          release=https://github.com/koalaman/shellcheck/releases/download
          name="shellcheck-${SHELLCHECK}"
          curl -fsSL "${release}/${SHELLCHECK}/${name}.linux.x86_64.tar.xz" |
            sudo tar -xJ --strip-components=1 -C /usr/local/bin \
              "${name}/shellcheck"
          shellcheck --version | grep version:
      - name: The same gate that runs before a commit
        run: ./checker.sh

  image:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image this would put on main still builds
        run: ./checker.sh --images-only
        env:
          DOCKER_BUILD_FLAGS: >-
            --cache-from type=gha --cache-to type=gha,mode=max
