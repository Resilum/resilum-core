---
name: checker

"on":
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: checker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every tool and version mise.toml pins
        uses: jdx/mise-action@v2
      - name: The toolchain rust-toolchain.toml pins, with its targets
        run: rustup show active-toolchain
      - name: The dated nightly whose rustfmt groups imports
        run: >-
          rustup toolchain install "$RUSTFMT_THAT_GROUPS_IMPORTS"
          --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: >-
            ${{ github.ref == 'refs/heads/main'
                || github.ref == 'refs/heads/stage' }}
      - name: The one thing mise does not carry
        run: sudo apt-get install -qq -y musl-tools
      - name: The same gate that runs before a commit
        run: ./checker.sh

  image:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image this would put on main still builds
        run: ./checker.sh --images-only
        env:
          DOCKER_BUILD_FLAGS: >-
            --cache-from type=gha --cache-to type=gha,mode=max
