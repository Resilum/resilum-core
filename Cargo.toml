[workspace]
resolver = "2"
members = [
  "crates/resilum-core",
  "crates/resilum-nostr",
  "crates/resilumd",
  "crates/resilum-ffi",
  "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# AGPL-3.0 because the core links the leviculum Rust Reticulum stack, which is
# AGPL-3.0.
license = "AGPL-3.0-only"

[workspace.lints.clippy]
all = "warn"

# A custom name, so its output dir matches — unlike `dev`, which lands in debug/.
[profile.quick]
inherits = "dev"
