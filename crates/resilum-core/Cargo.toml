[package]
name = "resilum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared core for a Resilum node: transports, discovery, egress policy."

[dependencies]
leviculum-std = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "f43184bc0780c2cac9c0e7e8456ef3a7a971e01d" }
leviculum-core = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "f43184bc0780c2cac9c0e7e8456ef3a7a971e01d" }
leviculum-lxmf = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "f43184bc0780c2cac9c0e7e8456ef3a7a971e01d" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
  "io-util",
  "net",
] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_yaml_ng = "0.10"
hmac = "0.12"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
sha2 = "0.10"
data-encoding = "2"
if-addrs = "0.15"
socket2 = "0.6"
futures = "0.3"
netstack-smoltcp = "0.2.4"
simple-dns = "0.12"

arti-client = { version = "0.44", optional = true, default-features = false, features = [
  "tokio",
  "rustls",
  "static-sqlite",
  "onion-service-client",
] }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tor-rtcompat = { version = "0.44", optional = true, default-features = false, features = [
  "tokio",
  "rustls",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "ring",
  "std",
] }
yosemite = { version = "0.7", optional = true }
tokio-smoltcp = { version = "0.6", optional = true }
iroh = { version = "=1.0.3", optional = true }
iroh-base = { version = "=1.0.3", optional = true, default-features = false, features = [
  "key",
  "relay",
] }
noq-udp = { version = "1.1", optional = true, default-features = false }
n0-watcher = { version = "1.0", optional = true }

[features]
default = []
arti = ["dep:arti-client", "dep:tokio-util", "dep:tor-rtcompat", "dep:rustls"]
i2p = ["dep:yosemite"]
ygg = ["dep:tokio-smoltcp"]
iroh = ["dep:iroh"]
iroh-protect = [
  "iroh",
  "iroh/unstable-custom-transports",
  "dep:iroh-base",
  "dep:noq-udp",
  "dep:n0-watcher",
]

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
