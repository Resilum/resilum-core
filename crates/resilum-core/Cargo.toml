[package]
name = "resilum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared core for a Resilum node: transports, discovery, egress policy."

[dependencies]
# Pinned by commit; bump deliberately. AGPL-3.0 (see ADR-003).
leviculum-std = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "03121dc109da0d327a74a6a3fb60a15cb7ed2a0e" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "net"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"

[lints]
workspace = true
