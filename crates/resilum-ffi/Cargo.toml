[package]
name = "resilum-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C-ABI wrapper over resilum-core for Dart FFI (mobile)."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
resilum-core = { path = "../resilum-core", features = ["arti"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
