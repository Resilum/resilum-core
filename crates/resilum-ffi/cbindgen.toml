# Regenerated from the Rust source on every build; gitignored, never committed.
language = "C"
include_guard = "RESILUM_H"
include_version = true
autogen_warning = "/* Autogenerated by cbindgen; do not edit. */"
documentation = true
documentation_style = "doxy"
header = """
/*
 * Threading: a node handle is NOT internally synchronised. Do not call any
 * resilum_node_* function on the same node from more than one thread at a time;
 * serialise them (e.g. one dedicated thread per node). resilum_last_error is
 * thread-local; each event handle is owned by the caller until resilum_event_free.
 */
"""

[export]
prefix = ""

[fn]
sort_by = "Name"

[parse]
parse_deps = false
