# Regenerated from the Rust source on every build; gitignored, never committed.
language = "C"
include_guard = "RESILUM_H"
include_version = true
autogen_warning = "/* Autogenerated by cbindgen; do not edit. */"
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[fn]
sort_by = "Name"

[parse]
parse_deps = false
