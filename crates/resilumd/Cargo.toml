[package]
name = "resilumd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resilum node daemon (Linux/server; packaged into the container image)."

[dependencies]
resilum-core = { path = "../resilum-core", features = ["iroh"] }
resilum-nostr = { path = "../resilum-nostr" }
ctrlc = { version = "3", features = ["termination"] }
data-encoding = "2"
if-addrs = "0.15"
leviculum-std = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "f43184bc0780c2cac9c0e7e8456ef3a7a971e01d" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
