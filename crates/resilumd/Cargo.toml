[package]
name = "resilumd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resilum node daemon (Linux/server; packaged into the container image)."

[dependencies]
resilum-core = { path = "../resilum-core", features = ["ble", "iroh"] }
resilum-nostr = { path = "../resilum-nostr" }
ctrlc = { version = "3", features = ["termination"] }
data-encoding = "2"
dbus = { version = "0.9", features = ["vendored"] }
edge-dhcp = { version = "0.8", default-features = false }
if-addrs = "0.15"
leviculum-std = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "3ed9cac1084d911bf250a84c99e2c86a1bb4860c" }
libc = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
futures = "0.3"
wl-nl80211 = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
