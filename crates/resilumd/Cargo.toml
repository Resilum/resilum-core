[package]
name = "resilumd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resilum node daemon (Linux/server; packaged into the container image)."

[dependencies]
resilum-core = { path = "../resilum-core" }
ctrlc = { version = "3", features = ["termination"] }
data-encoding = "2"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
