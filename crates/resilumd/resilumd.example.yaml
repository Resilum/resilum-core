---
# Example resilumd config. Pass with: resilumd --config resilumd.example.yaml

instance_name: my-node

# Persist identity and RNS state across restarts (omit for ephemeral).
storage_path: /var/lib/resilumd

# Auto-discover and mesh with peers on the local segment.
discover: true

# Join the global mesh through the built-in public + Yggdrasil anchors and a
# discoverable public listener on [::]:4242 (true by default). Set to false for
# an isolated node configured purely via `listen`/`bootstrap` below.
default_anchors: true

# Optional public TCP listener, so remote peers can reach this node.
# listen: "[::]:4242"

# Optional always-on anchors to bridge into the wider mesh.
# Yggdrasil needs no dedicated interface: point `listen` at `[::]` (covers the
# Yggdrasil IPv6) and add Yggdrasil peer addresses here as plain TCP anchors.
bootstrap:
  - anchor.example:4343

# Optional native I2P interface (needs a local i2pd with SAM on 127.0.0.1:7656).
# i2p:
#   connectable: true              # be reachable inbound over I2P
#   peers:                         # dial specific .b32.i2p peers
#     - somebase32.b32.i2p

# Be an exit: forward inbound links to a local SOCKS/service endpoint.
# egress:
#   service: socks-egress
#   target: 127.0.0.1:1080
#   exit_country: DE          # ISO code advertised to peers; omit for unknown

# Be a consumer: accept local TCP and forward through the fastest egress.
# connect:
#   services: [socks-egress, tor]
#   listen_tcp: 127.0.0.1:10808
#   use_own: smart            # smart | true | false
#   allow_countries: []
#   deny_countries: []
