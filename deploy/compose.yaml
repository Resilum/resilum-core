services:
  resilum:
    image: resilum:latest
    container_name: resilum
    restart: unless-stopped
    command: ["/config/resilumd.yaml"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/config
    environment:
      RUST_LOG: "info,resilum_core=debug,leviculum_std=debug"
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q '@rns/resilum' /proc/net/unix"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 60s

  rngit:
    build: ../docker/rngit
    image: resilum-rngit:latest
    container_name: resilum-rngit
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/rngit:/config/rngit
    depends_on:
      resilum:
        condition: service_healthy
