---
services:
  resilum:
    image: ghcr.io/resilum/resilum-core:latest
    container_name: resilum
    restart: unless-stopped
    command: ["/config/resilumd.yaml"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    # With `ble` or `wifi_group` set, uncomment this and the bus below: BlueZ
    # and NetworkManager refuse everyone but root.
    # user: "0:0"
    volumes:
      - ./config:/config
      # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    environment:
      RUST_LOG: "info,resilum_core=debug,leviculum_std=debug"

  rngit:
    image: ghcr.io/resilum/resilum-core-rngit:latest
    container_name: resilum-rngit
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/rngit:/config/rngit
    depends_on:
      resilum:
        condition: service_healthy
