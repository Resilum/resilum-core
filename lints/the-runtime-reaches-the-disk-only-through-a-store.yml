---
id: the-runtime-reaches-the-disk-only-through-a-store
language: Rust
severity: error
message: A file is reached outside a store.
files:
  - "crates/resilum-core/src/**"
  - "crates/resilum-nostr/src/**"
ignores:
  - "crates/resilum-core/src/discovery/store/**"
  - "crates/resilum-core/src/mirrors/store.rs"
  - "crates/resilum-core/src/mirrors/handover.rs"
  - "crates/resilum-core/src/mirrors/handover/**"
  - "crates/resilum-core/src/lxmf/checkpoint.rs"
  - "crates/resilum-core/src/lxmf/inbox/**"
  - "crates/resilum-core/src/storage/**"
  - "crates/resilum-core/src/identity.rs"
  - "crates/resilum-core/src/engine.rs"
  - "crates/resilum-core/src/iroh/key.rs"
  - "crates/resilum-nostr/src/queue/store.rs"
  - "crates/resilum-nostr/src/registry/store/**"
  - "crates/resilum-core/src/net/yggdrasil.rs"
  - "crates/resilum-core/src/ble/election/read_here.rs"
note: |
  These crates run inside the node runtime, where a worker waiting on a file
  serves no other future and the wait is as long as the storage takes. A store
  owns its file and the thread that writes it, everything else holds state in
  memory, and the list here is that boundary written down: the stores, the
  reads a node makes once while starting, and the two files under /proc and
  /sys that the kernel answers from memory rather than from storage.
rule:
  any:
    - pattern: fs::$M($$$ARGS)
    - pattern: std::fs::$M($$$ARGS)
    - pattern: fs::File::$M($$$ARGS)
    - pattern: std::fs::File::$M($$$ARGS)
    - pattern: File::$M($$$ARGS)
    - pattern: $F.sync_all()
    - pattern: $F.sync_data()
